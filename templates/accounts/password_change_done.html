{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} - Customer Records{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md">
        <div class="card">
            <div class="card-body p-8 text-center">
                <div class="w-14 h-14 mx-auto mb-4 flex items-center justify-center rounded-pill bg-success/12 text-success">
                    <i data-feather="check-circle" class="w-7 h-7"></i>
                </div>
                <h1 class="font-display text-2xl font-semibold tracking-tight text-ink">{% trans "Password Changed" %}</h1>
                <p class="text-sm text-muted mt-2">{% trans "Your password has been updated successfully." %}</p>
                <div class="mt-6 flex justify-center gap-3">
                    <a href="{% url 'accounts:profile' %}" class="btn btn-primary">{% trans "Back to Profile" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
